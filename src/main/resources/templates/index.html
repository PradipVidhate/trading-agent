<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Agent Dashboard</title>
    <style>
        :root {
            --bg: #09121f;
            --panel: #111b2d;
            --text: #edf2ff;
            --muted: #9fb3d9;
            --accent: #60a5fa;
            --accent2: #5eead4;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: rgba(148,163,184,0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #09121f 0%, #0d1727 100%);
            color: var(--text);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; padding: 16px 20px;
            background: rgba(17,27,45,0.9); border: 1px solid var(--border); border-radius: 16px;
        }
        h1 { margin: 0; font-size: 2rem; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer;
            color: var(--text); background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        button.secondary { background: #1e293b; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card {
            background: rgba(17,27,45,0.9); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .card h3 { margin: 0 0 16px; font-size: 1.1rem; }
        .status-box { display: flex; flex-direction: column; gap: 8px; }
        .status-row {
            display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted);
            padding-bottom: 8px; border-bottom: 1px solid rgba(148,163,184,0.12);
        }
        .field { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; color: var(--muted); }
        input, select {
            width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0f172a; color: var(--text);
        }
        .result-box {
            margin-top: 16px; background: #0a1320; border: 1px solid var(--border); border-radius: 12px; padding: 14px;
            min-height: 120px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #dfe7ff;
        }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
        th { color: var(--muted); font-weight: 600; }
        @media (max-width: 640px) {
            .topbar { flex-direction: column; align-items: flex-start; }
            .actions { width: 100%; }
            button { flex: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Trading Agent</h1>
            <div class="actions">
                <button id="loginBtn">Login with Kite</button>
                <button id="logoutBtn" class="secondary">Logout</button>
                <button id="refreshBtn" class="secondary">Refresh</button>
            </div>
        </div>

        <div id="loginBanner" class="result-box" style="display:none; margin-bottom:18px;"></div>

        <div class="grid">
            <div class="card">
                <h3>Session</h3>
                <div class="status-box">
                    <div class="status-row"><span>State</span><strong id="sessionState">Checking...</strong></div>
                    <div class="status-row"><span>User</span><span id="sessionUser">-</span></div>
                    <div class="status-row"><span>Access token</span><span id="sessionToken">-</span></div>
                </div>
            </div>

            <div class="card">
                <h3>Instrument Master</h3>
                <div class="status-box">
                    <div class="status-row"><span>Total instruments</span><strong id="instrumentCount">0</strong></div>
                    <div class="status-row"><span>Search symbol</span><input id="searchSymbol" placeholder="e.g. NIFTY" /></div>
                    <div class="status-row"><span></span><button id="searchBtn" class="secondary" style="width: 100%;">Search</button></div>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Signal Generator</h3>
                <div class="field">
                    <label>Symbol</label>
                    <input id="signalSymbol" value="NIFTY" />
                </div>
                <div class="field" style="margin-top: 12px;">
                    <label>Interval</label>
                    <select id="signalInterval">
                        <option value="5minute" selected>5minute</option>
                        <option value="1minute">1minute</option>
                        <option value="day">day</option>
                    </select>
                </div>
                <div class="field" style="margin-top: 12px;">
                    <label>Days</label>
                    <input id="signalDays" type="number" value="5" min="1" max="30" />
                </div>
                <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="levelBtn">Get Levels</button>
                    <button id="signalBtn" class="secondary">Get Signal</button>
                </div>
                <div id="signalResult" class="result-box">No signal loaded yet.</div>
            </div>

            <div class="card">
                <h3>Bulk Scan</h3>
                <div class="field">
                    <label>Symbols</label>
                    <input id="scanSymbols" value="NIFTY, BANKNIFTY" />
                </div>
                <div class="field" style="margin-top: 12px;">
                    <label>Interval</label>
                    <select id="scanInterval">
                        <option value="5minute" selected>5minute</option>
                        <option value="1minute">1minute</option>
                        <option value="day">day</option>
                    </select>
                </div>
                <div class="field" style="margin-top: 12px;">
                    <label>Days</label>
                    <input id="scanDays" type="number" value="5" min="1" max="30" />
                </div>
                <div style="margin-top: 16px;">
                    <button id="scanBtn">Scan Signals</button>
                </div>
                <div id="scanResult" class="result-box">No scan run yet.</div>
            </div>
        </div>

        <div class="card">
            <h3>Historical Data</h3>
            <div class="field">
                <label>Symbol</label>
                <input id="historySymbol" value="NIFTY" />
            </div>
            <div class="field" style="margin-top: 12px;">
                <label>Interval</label>
                <select id="historyInterval">
                    <option value="5minute" selected>5minute</option>
                    <option value="1minute">1minute</option>
                    <option value="day">day</option>
                </select>
            </div>
            <div class="field" style="margin-top: 12px;">
                <label>Days</label>
                <input id="historyDays" type="number" value="5" min="1" max="30" />
            </div>
            <div style="margin-top: 16px;">
                <button id="historyBtn">Load History</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Open</th>
                            <th>High</th>
                            <th>Low</th>
                            <th>Close</th>
                            <th>Volume</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3>Kite Alerts</h3>
            <div class="field">
                <label>Interval</label>
                <select id="alertInterval">
                    <option value="5minute" selected>5minute</option>
                    <option value="1minute">1minute</option>
                    <option value="day">day</option>
                </select>
            </div>
            <div class="field" style="margin-top: 12px;">
                <label>Days</label>
                <input id="alertDays" type="number" value="5" min="1" max="30" />
            </div>
            <div style="margin-top: 16px;">
                <button id="alertBtn">Create / Update Alerts</button>
            </div>
            <div id="alertResult" class="result-box">No alerts setup yet.</div>
        </div>
    </div>

    <script>
        const api = {
            login: '/login',
            logout: '/logout',
            session: '/session',
            count: '/market/count',
            search: '/market/search',
            history: '/market/history',
            levels: '/strategy/levels',
            signal: '/strategy/signal',
            signals: '/strategy/signals',
            alerts: '/strategy/kite-alerts'
        };

        function jsonToText(value) {
            return JSON.stringify(value, null, 2);
        }

        function showBanner(message, type = 'info') {
            const banner = document.getElementById('loginBanner');
            banner.style.display = 'block';
            banner.style.borderColor = type === 'error' ? '#f87171' : '#60a5fa';
            banner.style.color = type === 'error' ? '#fecaca' : '#dfe7ff';
            banner.textContent = message;
        }

        function renderSession(data) {
            const isLoggedIn = data && data !== 'No Active Session';
            document.getElementById('sessionState').textContent = isLoggedIn ? 'Logged In' : 'Logged Out';
            document.getElementById('sessionUser').textContent = isLoggedIn ? (data.userName || '-') : '-';
            document.getElementById('sessionToken').textContent = isLoggedIn && data.accessToken ? data.accessToken.slice(0, 18) + '...' : '-';

            const loginBanner = document.getElementById('loginBanner');
            if (!isLoggedIn) {
                loginBanner.style.display = 'block';
                loginBanner.textContent = 'Please login with Kite to enable all trading features.';
                loginBanner.style.borderColor = '#fbbf24';
                loginBanner.style.color = '#fef3c7';
            } else {
                loginBanner.style.display = 'none';
            }
        }

        async function loadSession() {
            try {
                const response = await fetch(api.session);
                const text = await response.text();
                if (text === 'No Active Session') {
                    renderSession(null);
                    document.getElementById('instrumentCount').textContent = '0';
                    return;
                }
                renderSession(JSON.parse(text));
            } catch (error) {
                renderSession(null);
                console.error(error);
            }
        }

        async function loadCount() {
            try {
                const response = await fetch(api.count);
                const result = await response.json();
                document.getElementById('instrumentCount').textContent = result && result.data ? result.data : 0;
            } catch (error) {
                document.getElementById('instrumentCount').textContent = '0';
            }
        }

        async function doRequest(url, targetId, method = 'GET') {
            const response = await fetch(url, { method });
            const text = await response.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = text; }

            if (!response.ok) {
                const message = typeof parsed === 'string' ? parsed : (parsed && parsed.message ? parsed.message : 'Request failed');
                document.getElementById(targetId).textContent = message;
                showBanner(message, 'error');
                return parsed;
            }

            document.getElementById(targetId).textContent = typeof parsed === 'string' ? parsed : jsonToText(parsed);
            return parsed;
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            window.location.href = api.login;
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch(api.logout);
            showBanner('Logged out successfully. Please login again to continue.', 'info');
            await loadSession();
            await loadCount();
        });

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            await loadSession();
            await loadCount();
        });

        document.getElementById('searchBtn').addEventListener('click', async () => {
            const symbol = document.getElementById('searchSymbol').value.trim();
            if (!symbol) return;
            const result = await doRequest(`${api.search}?symbol=${encodeURIComponent(symbol)}`, 'signalResult');
            document.getElementById('signalResult').textContent = jsonToText(result && result.data ? result.data : result);
        });

        document.getElementById('levelBtn').addEventListener('click', async () => {
            const symbol = document.getElementById('signalSymbol').value || 'NIFTY';
            const interval = document.getElementById('signalInterval').value;
            const days = document.getElementById('signalDays').value;
            const url = `${api.levels}?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&days=${days}`;
            await doRequest(url, 'signalResult');
        });

        document.getElementById('signalBtn').addEventListener('click', async () => {
            const symbol = document.getElementById('signalSymbol').value || 'NIFTY';
            const interval = document.getElementById('signalInterval').value;
            const days = document.getElementById('signalDays').value;
            const url = `${api.signal}?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&days=${days}`;
            await doRequest(url, 'signalResult');
        });

        document.getElementById('scanBtn').addEventListener('click', async () => {
            const symbols = document.getElementById('scanSymbols').value;
            const interval = document.getElementById('scanInterval').value;
            const days = document.getElementById('scanDays').value;
            const url = `${api.signals}?symbols=${encodeURIComponent(symbols)}&interval=${encodeURIComponent(interval)}&days=${days}`;
            await doRequest(url, 'scanResult');
        });

        document.getElementById('historyBtn').addEventListener('click', async () => {
            const symbol = document.getElementById('historySymbol').value;
            const interval = document.getElementById('historyInterval').value;
            const days = document.getElementById('historyDays').value;
            const url = `${api.history}?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&days=${days}`;
            const result = await doRequest(url, 'signalResult');
            const candles = result && result.data ? result.data : [];
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            candles.slice(0, 20).forEach(c => {
                const row = document.createElement('tr');
                row.innerHTML = '<td>' + (c.time || '') + '</td><td>' + (c.open ?? '') + '</td><td>' + (c.high ?? '') + '</td><td>' + (c.low ?? '') + '</td><td>' + (c.close ?? '') + '</td><td>' + (c.volume ?? '') + '</td>';
                tbody.appendChild(row);
            });
        });

        document.getElementById('alertBtn').addEventListener('click', async () => {
            const interval = document.getElementById('alertInterval').value;
            const days = document.getElementById('alertDays').value;
            const url = `${api.alerts}?interval=${encodeURIComponent(interval)}&days=${days}`;
            await doRequest(url, 'alertResult', 'POST');
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('login') === 'success') {
            showBanner('Login successful. You can now use the dashboard features.', 'info');
        }

        loadSession();
        loadCount();
    </script>
</body>
</html>
